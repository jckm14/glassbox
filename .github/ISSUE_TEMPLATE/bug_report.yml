name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use GitHub private vulnerability reporting as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Glassbox version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Linux distribution and filesystem
      placeholder: Ubuntu 24.04, ext4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact commands or a small test case with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, signing keys, receipt databases, snapshots, and private recovery content.
      render: shell
