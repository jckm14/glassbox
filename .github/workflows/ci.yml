name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install POSIX ACL and shell tools
        run: sudo apt-get update && sudo apt-get install --yes acl shellcheck
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Check formatting
        run: uv run ruff format --check src tests scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Lint
        run: uv run ruff check src tests scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Lint launch renderer shell
        run: shellcheck scripts/render-launch-assets.sh
      - name: Type-check
        run: uv run mypy src scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Compile
        run: uv run python -m compileall -q src tests scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Test
        run: uv run pytest -q

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"
          enable-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: uv build
      - name: Clean-install wheel
        run: |
          uv venv /tmp/glassbox-release
          uv pip install --python /tmp/glassbox-release/bin/python dist/*.whl
          /tmp/glassbox-release/bin/glassbox --help
          /tmp/glassbox-release/bin/python -c "import glassbox, importlib.metadata as m; assert glassbox.__version__ == m.version('glassbox-agent'), (glassbox.__version__, m.version('glassbox-agent'))"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glassbox-distributions
          path: dist/
          if-no-files-found: error
