name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          enable-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install POSIX ACL and shell tools
        run: sudo apt-get update && sudo apt-get install --yes acl shellcheck
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Check formatting
        run: uv run ruff format --check src tests scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Lint
        run: uv run ruff check src tests scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Lint launch renderer shell
        run: shellcheck scripts/render-launch-assets.sh
      - name: Type-check
        run: uv run mypy src scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Compile
        run: uv run python -m compileall -q src tests scripts/render-launch-server.py scripts/validate-launch-assets.py scripts/publish-launch-assets.py
      - name: Test
        run: uv run pytest -q

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          enable-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: uv build
      - name: Clean-install wheel
        run: |
          uv venv /tmp/glassbox-release
          uv pip install --python /tmp/glassbox-release/bin/python dist/*.whl
          /tmp/glassbox-release/bin/glassbox --help
          /tmp/glassbox-release/bin/python -c "import glassbox; assert glassbox.__version__ == '0.1.1'"
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: glassbox-distributions
          path: dist/
          if-no-files-found: error
