name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install POSIX ACL tools
        run: sudo apt-get update && sudo apt-get install --yes acl
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run mypy src
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Test
        run: uv run pytest -q

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: uv build
      - name: Clean-install wheel
        run: |
          uv venv /tmp/glassbox-release
          uv pip install --python /tmp/glassbox-release/bin/python dist/*.whl
          /tmp/glassbox-release/bin/glassbox --help
          /tmp/glassbox-release/bin/python -c "import glassbox; assert glassbox.__version__ == '0.1.1'"
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glassbox-distributions
          path: dist/
          if-no-files-found: error
